name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask pymupdf openai requests tqdm tenacity numpy onnxruntime babeldoc

      - name: Create .app bundle
        run: |
          APP="dist/PDF Translator.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources/app"
          mkdir -p "$APP/Contents/Resources/app/templates"
          mkdir -p "$APP/Contents/Resources/app/static"
          mkdir -p "$APP/Contents/Resources/app/pdf2zh"
          
          cp gui_app.py "$APP/Contents/Resources/app/app.py"
          cp app.py "$APP/Contents/Resources/app/flask_app.py"
          cp -r templates/* "$APP/Contents/Resources/app/templates/" 2>/dev/null || true
          cp -r static/* "$APP/Contents/Resources/app/static/" 2>/dev/null || true
          cp -r pdf2zh/* "$APP/Contents/Resources/app/pdf2zh/" 2>/dev/null || true
          
          cat > "$APP/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>PDF Translator</string>
              <key>CFBundleDisplayName</key>
              <string>PDF Translator</string>
              <key>CFBundleIdentifier</key>
              <string>com.alter.pdftranslator</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleExecutable</key>
              <string>launcher</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSRequiresAquaSystemAppearance</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          cat > "$APP/Contents/MacOS/launcher" << 'LAUNCHER'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")/.." && pwd)"
          APP_DIR="$DIR/Resources/app"
          export PYTHONPATH="$APP_DIR:$APP_DIR/pdf2zh:$PYTHONPATH"
          export PYTHONIOENCODING=utf-8
          
          PYTHON_CMD=""
          if command -v python3 &> /dev/null; then PYTHON_CMD="python3"
          elif command -v python &> /dev/null; then PYTHON_CMD="python"
          else
            osascript -e 'display dialog "需要安装 Python 3" buttons {"OK"} default button "OK" with icon stop'
            exit 1
          fi
          
          MISSING=""
          for pkg in flask pymupdf openai requests tqdm tenacity numpy onnxruntime babeldoc; do
            imp="$pkg"; [ "$pkg" = "pymupdf" ] && imp="fitz"
            $PYTHON_CMD -c "import $imp" 2>/dev/null || MISSING="$MISSING $pkg"
          done
          if [ -n "$MISSING" ]; then
            osascript -e 'display dialog "首次运行，正在安装依赖...\n请稍候" buttons {"OK"} default button "OK" giving up after 3' &
            pip3 install $MISSING -q 2>/dev/null
          fi
          
          cd "$APP_DIR"
          exec $PYTHON_CMD app.py
          LAUNCHER
          chmod +x "$APP/Contents/MacOS/launcher"

      - name: Create DMG
        run: |
          STAGING="dmg_staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -r "dist/PDF Translator.app" "$STAGING/"
          ln -sf /Applications "$STAGING/Applications"
          hdiutil create -volname "PDF Translator" -srcfolder "$STAGING" -ov -format UDZO "PDF-Translator-macOS.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Translator-macOS
          path: PDF-Translator-macOS.dmg
          retention-days: 90
