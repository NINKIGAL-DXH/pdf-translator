name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create DMG (no build, just package)
        run: |
          # Create staging directory
          STAGING="staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/PDF Translator"
          
          # Copy all source files
          cp app.py "$STAGING/PDF Translator/"
          cp start.command "$STAGING/PDF Translator/"
          cp -r templates "$STAGING/PDF Translator/"
          cp -r pdf2zh "$STAGING/PDF Translator/"
          
          # Make start.command executable
          chmod +x "$STAGING/PDF Translator/start.command"
          
          # Add Applications link
          ln -sf /Applications "$STAGING/Applications"
          
          # Create DMG
          hdiutil create -volname "PDF Translator" -srcfolder "$STAGING" -ov -format UDZO PDF-Translator-macOS.dmg
          echo "=== DMG size ==="
          du -sh PDF-Translator-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Translator-macOS
          path: PDF-Translator-macOS.dmg
