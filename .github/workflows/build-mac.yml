name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask pymupdf openai requests tqdm tenacity numpy onnxruntime babeldoc pyinstaller

      - name: PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "PDF Translator" \
            --add-data "templates:templates" \
            --add-data "pdf2zh:pdf2zh" \
            --hidden-import flask --hidden-import pymupdf --hidden-import fitz \
            --hidden-import pdf2zh --hidden-import pdf2zh.high_level --hidden-import pdf2zh.translator \
            --hidden-import pdf2zh.converter --hidden-import pdf2zh.doclayout --hidden-import pdf2zh.config \
            --hidden-import pdf2zh.cache --hidden-import pdf2zh.pdfinterp --hidden-import pdf2zh.backend \
            --hidden-import pdf2zh.kernel --hidden-import pdf2zh.pdf2zh \
            --hidden-import babeldoc --hidden-import babeldoc.assets --hidden-import babeldoc.assets.assets \
            --hidden-import onnxruntime --hidden-import numpy --hidden-import openai \
            --hidden-import requests --hidden-import tqdm --hidden-import tenacity \
            --exclude-module tkinter --exclude-module matplotlib \
            main.py

      - name: Package .app
        run: |
          APP="dist/PDF Translator.app"
          SRC="dist/PDF Translator"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -r "$SRC/"* "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>PDF Translator</string>
          <key>CFBundleExecutable</key><string>PDF Translator</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF

      - name: Ad-hoc sign
        run: |
          # Clean up files that confuse codesign
          find "dist/PDF Translator.app" -name "*.dist-info" -type d -exec rm -rf {} + 2>/dev/null || true
          find "dist/PDF Translator.app" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          
          # Sign all dylibs and .so files individually first
          find "dist/PDF Translator.app" -name "*.dylib" -exec codesign --force --sign - {} \; 2>/dev/null || true
          find "dist/PDF Translator.app" -name "*.so" -exec codesign --force --sign - {} \; 2>/dev/null || true
          
          # Sign the main executable
          codesign --force --sign - "dist/PDF Translator.app/Contents/MacOS/PDF Translator" 2>/dev/null || true
          
          # Sign the entire bundle
          codesign --force --sign - "dist/PDF Translator.app" 2>/dev/null || true
          
          echo "=== Verify ==="
          codesign -dvvv "dist/PDF Translator.app" 2>&1 | head -5 || true

      - name: Create DMG
        run: |
          mkdir -p dmg && cp -r "dist/PDF Translator.app" dmg/ && ln -sf /Applications dmg/Applications
          hdiutil create -volname "PDF Translator" -srcfolder dmg -ov -format UDZO PDF-Translator-macOS.dmg
          echo "=== DMG size ==="
          du -sh PDF-Translator-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Translator-macOS
          path: PDF-Translator-macOS.dmg
