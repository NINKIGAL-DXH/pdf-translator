name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install optimized dependencies
        run: |
          python -m pip install --upgrade pip
          # Use onnxruntime-silicon for Apple Silicon (smaller)
          python -m pip install flask pymupdf openai requests tqdm tenacity numpy babeldoc pyinstaller
          python -m pip install onnxruntime-silicon || python -m pip install onnxruntime

      - name: Strip large unnecessary files
        run: |
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "Site: $SITE"
          # Remove tests, docs, examples from packages
          find "$SITE" -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find "$SITE" -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find "$SITE" -type d -name "examples" -exec rm -rf {} + 2>/dev/null || true
          find "$SITE" -type d -name "doc" -exec rm -rf {} + 2>/dev/null || true
          find "$SITE" -type d -name "docs" -exec rm -rf {} + 2>/dev/null || true
          # Remove .pyc __pycache__
          find "$SITE" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          # Remove large unused numpy/scipy test data
          find "$SITE" -name "*.npz" -size +1M -delete 2>/dev/null || true
          # Show size
          du -sh "$SITE"

      - name: PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "PDF Translator" \
            --add-data "templates:templates" \
            --add-data "pdf2zh:pdf2zh" \
            --hidden-import flask --hidden-import pymupdf --hidden-import fitz \
            --hidden-import pdf2zh --hidden-import pdf2zh.high_level --hidden-import pdf2zh.translator \
            --hidden-import pdf2zh.converter --hidden-import pdf2zh.doclayout --hidden-import pdf2zh.config \
            --hidden-import pdf2zh.cache --hidden-import pdf2zh.pdfinterp --hidden-import pdf2zh.backend \
            --hidden-import pdf2zh.kernel --hidden-import pdf2zh.pdf2zh \
            --hidden-import babeldoc --hidden-import babeldoc.assets --hidden-import babeldoc.assets.assets \
            --hidden-import onnxruntime --hidden-import numpy --hidden-import openai \
            --hidden-import requests --hidden-import tqdm --hidden-import tenacity \
            --exclude-module tkinter --exclude-module matplotlib \
            --exclude-module unittest --exclude-module email \
            --exclude-module xml --exclude-module pydoc \
            --exclude-module lib2to3 --exclude-module ensurepip \
            main.py

      - name: Clean dist
        run: |
          # Remove unnecessary files from dist
          find "dist/PDF Translator/_internal" -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find "dist/PDF Translator/_internal" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "dist/PDF Translator/_internal" -name "*.pyc" -delete 2>/dev/null || true
          echo "=== Final size ==="
          du -sh "dist/PDF Translator"

      - name: Package
        run: |
          APP="dist/PDF Translator.app"
          SRC="dist/PDF Translator"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -r "$SRC/"* "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>PDF Translator</string>
          <key>CFBundleExecutable</key><string>PDF Translator</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF

      - name: Code sign (ad-hoc)
        run: |
          codesign --deep --force --sign - "dist/PDF Translator.app"
          echo "Signed OK"

      - name: DMG with max compression
        run: |
          mkdir -p dmg && cp -r "dist/PDF Translator.app" dmg/ && ln -sf /Applications dmg/Applications
          hdiutil create -volname "PDF Translator" -srcfolder dmg -ov -format UDZO "PDF-Translator-macOS.dmg"
          echo "=== DMG size ==="
          du -sh "PDF-Translator-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Translator-macOS
          path: PDF-Translator-macOS.dmg
