name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .app bundle
        run: |
          APP_DIR="dist/PDF Translator.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources/app"
          mkdir -p "$APP_DIR/Contents/Resources/app/templates"
          mkdir -p "$APP_DIR/Contents/Resources/app/static"
          
          # Copy app files
          cp app.py "$APP_DIR/Contents/Resources/app/"
          cp -r templates/* "$APP_DIR/Contents/Resources/app/templates/" 2>/dev/null || true
          cp -r static/* "$APP_DIR/Contents/Resources/app/static/" 2>/dev/null || true
          cp -r pdf2zh "$APP_DIR/Contents/Resources/app/"
          
          # Create Info.plist
          cat > "$APP_DIR/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>PDF Translator</string>
              <key>CFBundleDisplayName</key>
              <string>PDF Translator</string>
              <key>CFBundleIdentifier</key>
              <string>com.alter.pdftranslator</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleExecutable</key>
              <string>launcher</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # Create launcher script
          cat > "$APP_DIR/Contents/MacOS/launcher" << 'LAUNCHER'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")/.." && pwd)"
          APP_DIR="$DIR/Resources/app"
          export PYTHONPATH="$APP_DIR:$APP_DIR/pdf2zh:$PYTHONPATH"
          export PYTHONIOENCODING=utf-8
          
          PYTHON_CMD=""
          if command -v python3 &> /dev/null; then PYTHON_CMD="python3"
          elif command -v python &> /dev/null; then PYTHON_CMD="python"
          else
            osascript -e 'display dialog "需要安装 Python" buttons {"OK"} default button "OK" with icon stop'
            exit 1
          fi
          
          # Auto-install missing deps
          for pkg in flask pymupdf openai requests tqdm tenacity numpy onnxruntime babeldoc; do
            import_name="$pkg"
            [ "$pkg" = "pymupdf" ] && import_name="fitz"
            $PYTHON_CMD -c "import $import_name" 2>/dev/null || pip3 install "$pkg" -q 2>/dev/null
          done
          
          # Check port
          if lsof -Pi :5000 -sTCP:LISTEN -t >/dev/null 2>&1; then
            osascript -e 'display dialog "端口 5000 被占用" buttons {"OK"} default button "OK" with icon stop'
            exit 1
          fi
          
          sleep 2
          open http://localhost:5000 &
          cd "$APP_DIR"
          exec $PYTHON_CMD app.py
          LAUNCHER
          chmod +x "$APP_DIR/Contents/MacOS/launcher"

      - name: Create DMG
        run: |
          DMG_DIR="dmg_staging"
          rm -rf "$DMG_DIR"
          mkdir -p "$DMG_DIR"
          cp -r "dist/PDF Translator.app" "$DMG_DIR/"
          ln -sf /Applications "$DMG_DIR/Applications"
          hdiutil create -volname "PDF Translator" -srcfolder "$DMG_DIR" -ov -format UDZO "PDF-Translator-macOS.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Translator-macOS
          path: PDF-Translator-macOS.dmg
          retention-days: 90
